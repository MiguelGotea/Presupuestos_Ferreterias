<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promociones y Descuentos · El Halcón</title>
<meta name="description" content="Catálogo de ofertas, promociones y descuentos en El Halcón Nicaragua.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Promociones y Descuentos · El Halcón">
<meta property="og:description" content="Consulta productos en oferta con descuento en El Halcón Nicaragua.">
<meta property="og:site_name" content="Presupuestos Ferreterías">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">🏷️ El Halcón <span>Promociones</span></div>
  <div class="search-wrap">
    <input id="q" type="search" placeholder="Filtrar por nombre… (dejar vacío para ver todos los descuentos)">
    <button class="btn btn-disc" id="reload-btn">🔄 Recargar</button>
  </div>
  <a href="/ferreterias/elhalcon/presupuestos/" class="back-link">← Presupuestos</a>
  <a href="/" class="back-link" style="margin-left:4px;">↩ Ferreterías</a>
</header>

<!-- BARRA DE ESTADO -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-val" id="stat-total">0</div>
    <div class="stat-label">Con descuento</div>
  </div>
  <div class="stat-item">
    <div class="stat-val" id="stat-max">0%</div>
    <div class="stat-label">Mayor descuento</div>
  </div>
  <div class="stat-item">
    <div class="stat-val" id="stat-avg">0%</div>
    <div class="stat-label">Descuento promedio</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:5px">
    <div class="loading-bar"><div class="loading-fill" id="load-fill"></div></div>
    <div id="status-msg">Cargando productos en oferta…</div>
  </div>
</div>

<div class="panel">
  <!-- FILTROS -->
  <div class="filter-bar">
    <label>Ordenar:</label>
    <select id="sort-sel">
      <option value="disc">Mayor descuento %</option>
      <option value="saving">Mayor ahorro C$</option>
      <option value="price-asc">Menor precio</option>
      <option value="price-desc">Mayor precio</option>
    </select>
    <span class="filter-count" id="filter-count"></span>
  </div>
  <div id="results"><div class="empty">Cargando productos con descuento…</div></div>
</div>

<div id="modal"><div class="modal-box" id="mbox"></div></div>

<script src="app.js"></script>
</body>
</html>
