<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos Sinsa</title>
<meta name="description" content="Cotizador de presupuestos y materiales en tiempo real con catálogo oficial de Sinsa.">
<link rel="icon" type="image/svg+xml" href="/favicon-sinsa.svg">
<link rel="shortcut icon" href="/favicon-sinsa.svg">

<!-- Open Graph / WhatsApp / Redes Sociales -->
<meta property="og:type" content="website">
<meta property="og:title" content="Presupuestos Sinsa · Cotizador en Vivo">
<meta property="og:description" content="Busca materiales de construcción, calcula precios con IVA y arma presupuestos oficiales de Sinsa.">
<meta property="og:site_name" content="Presupuestos Ferreterías">
<meta property="og:image" content="https://b2csinsa.vtexassets.com/assets/vtex/assets-builder/b2csinsa.store-theme/4.0.16/img/20240919-logo-superior___51c25e88f36f56881a0ce642224ed5c7.svg">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Presupuestos Sinsa · Cotizador en Vivo">
<meta name="twitter:description" content="Busca materiales de construcción, calcula precios con IVA y arma presupuestos oficiales de Sinsa.">
<meta name="twitter:image" content="https://b2csinsa.vtexassets.com/assets/vtex/assets-builder/b2csinsa.store-theme/4.0.16/img/20240919-logo-superior___51c25e88f36f56881a0ce642224ed5c7.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="/" class="header-link" style="padding:6px 10px;">← Ferreterías</a>
  <div class="logo">🧱 Sinsa <span>Presupuestos</span></div>
  <input id="q" type="search" placeholder="Buscar por nombre o marca… (ej: cable tsj ecoplus, tubo 1/2 durman)" autofocus>
  <a href="/ferreterias/sinsa/descuentos/" target="_blank" class="header-link">🏷️ Ver promociones</a>
</header>

<main>

  <!-- RESULTADOS -->
  <section class="panel">
    <div class="panel-head">
      <h2>Resultados <span class="meta" id="count"></span></h2>
      <button id="toggle-disc"><span class="dot"></span>🏷️ Solo con descuento</button>
    </div>
    <div id="results"><div class="empty">Empieza a escribir para buscar productos.</div></div>
    <button id="more" class="btn btn-sec" hidden>Cargar más resultados</button>
  </section>

  <!-- PRESUPUESTO -->
  <aside class="panel" id="budget-panel">
    <div class="panel-head">
      <h2>🧾 Presupuesto <span class="meta" id="nitems">0 ítems</span></h2>
      <button class="btn btn-sec btn-sm" id="clear" title="Vaciar presupuesto">🗑 Vaciar</button>
    </div>
    <div id="budget"><div class="empty">Añade productos con "+".</div></div>
    <div class="budget-total-bar">
      <span class="label">Total</span>
      <span class="amount" id="total">C$0.00</span>
    </div>
    <div class="budget-actions">
      <button class="btn btn-print" id="print">🖨 Imprimir Presupuesto</button>
    </div>
  </aside>

</main>

<div id="modal"><div class="modal-box" id="mbox"></div></div>

<!-- Popover flotante para filtro de columnas (Marca y Unidad) -->
<div id="col-filter-popover" class="col-filter-popover">
  <div class="popover-head">
    <span id="popover-title">Filtrar</span>
    <button type="button" id="popover-close" class="popover-close-btn" title="Cerrar">&times;</button>
  </div>
  <div class="popover-quick">
    <button type="button" id="popover-all" class="popover-link-btn">Todas</button>
    <span class="popover-sep">|</span>
    <button type="button" id="popover-none" class="popover-link-btn">Ninguna</button>
    <span class="popover-sep">|</span>
    <button type="button" id="popover-reset" class="popover-link-btn">Restablecer</button>
  </div>
  <div class="popover-search-wrap">
    <input type="text" id="popover-search" placeholder="Buscar opción…" autocomplete="off">
  </div>
  <div class="popover-list" id="popover-list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
