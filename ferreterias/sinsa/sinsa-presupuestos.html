<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos Sinsa</title>
<meta name="description" content="Cotizador de presupuestos y materiales en tiempo real con catálogo oficial de Sinsa.">
<link rel="icon" type="image/svg+xml" href="/favicon-sinsa.svg">
<link rel="shortcut icon" href="/favicon-sinsa.svg">

<!-- Open Graph / WhatsApp / Redes Sociales -->
<meta property="og:type" content="website">
<meta property="og:title" content="Presupuestos Sinsa · Cotizador en Vivo">
<meta property="og:description" content="Busca materiales de construcción, calcula precios con IVA y arma presupuestos oficiales de Sinsa.">
<meta property="og:site_name" content="Presupuestos Ferreterías">
<meta property="og:image" content="https://b2csinsa.vtexassets.com/assets/vtex/assets-builder/b2csinsa.store-theme/4.0.16/img/20240919-logo-superior___51c25e88f36f56881a0ce642224ed5c7.svg">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Presupuestos Sinsa · Cotizador en Vivo">
<meta name="twitter:description" content="Busca materiales de construcción, calcula precios con IVA y arma presupuestos oficiales de Sinsa.">
<meta name="twitter:image" content="https://b2csinsa.vtexassets.com/assets/vtex/assets-builder/b2csinsa.store-theme/4.0.16/img/20240919-logo-superior___51c25e88f36f56881a0ce642224ed5c7.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --g:#1b6e2e;--g2:#28a745;--gl:#e8f5e9;--gl2:#d4edda;
    --o:#e67e22;--od:#d35400;--ob:#fef3e8;
    --r:#c0392b;--rb:#fdecea;
    --bd:#e0e7e1;--bg:#f0f4f1;--card:#fff;
    --tx:#1a2b1c;--mu:#5c7260;--light:#8fa38f;
    --shadow:0 2px 12px rgba(0,0,0,.07);--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.5 'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx)}

  /* HEADER */
  header{background:linear-gradient(135deg,#1b6e2e,#28a745);padding:11px 18px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 16px rgba(27,110,46,.35)}
  .logo{font-size:18px;font-weight:700;color:#fff;white-space:nowrap}
  .logo span{opacity:.7;font-weight:400;font-size:12px}
  #q{flex:1;padding:9px 15px;border:0;border-radius:999px;font:14px 'Inter',sans-serif;outline:none;background:rgba(255,255,255,.18);color:#fff;transition:background .2s}
  #q::placeholder{color:rgba(255,255,255,.6)}
  #q:focus{background:rgba(255,255,255,.28)}
  .header-link{color:rgba(255,255,255,.85);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);transition:background .2s}
  .header-link:hover{background:rgba(255,255,255,.2)}

  /* LAYOUT 60/40 */
  main{display:grid;grid-template-columns:3fr 2fr;gap:14px;padding:14px 18px;align-items:start}
  @media(max-width:1100px){main{grid-template-columns:1fr}}

  /* PANEL */
  .panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .panel-head{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap}
  .panel-head h2{font-size:13px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .meta{font-size:11px;color:var(--mu);font-weight:400}

  /* TOGGLE DESCUENTO */
  #toggle-disc{
    display:flex;align-items:center;gap:6px;padding:5px 11px;
    border:1.5px solid var(--bd);border-radius:999px;background:#fff;
    font:11px/1 'Inter',sans-serif;font-weight:700;color:var(--mu);cursor:pointer;
    transition:all .2s;white-space:nowrap
  }
  #toggle-disc.on{background:var(--ob);border-color:var(--o);color:var(--od)}
  #toggle-disc .dot{width:8px;height:8px;border-radius:50%;background:var(--bd);transition:background .2s}
  #toggle-disc.on .dot{background:var(--o)}

  /* TABLE */
  table{width:100%;border-collapse:collapse}
  th{font-size:10px;text-transform:uppercase;color:var(--light);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--bd);background:#fafcfa;user-select:none;white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid #f0f4f1;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fafffe}
  td.img-cell{width:54px;padding:5px 6px}
  td.img-cell img{width:44px;height:44px;object-fit:contain;border-radius:7px;border:1px solid var(--bd);background:#fff;cursor:zoom-in;display:block}
  .name{font-weight:600;font-size:12px;line-height:1.3}
  .sub{font-size:11px;color:var(--mu);margin-top:1px}
  .unit-badge{display:inline-block;background:#e8f0fe;color:#1a56db;font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;border:1px solid #c3d5fd;white-space:nowrap}
  .price-col{font-weight:700;color:var(--g);white-space:nowrap;text-align:right}
  .list-price{font-size:10px;color:var(--light);text-decoration:line-through}
  .badge-disc{display:inline-block;background:var(--o);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;vertical-align:middle}
  .badge-avail{display:inline-block;font-size:10px;font-weight:600;border-radius:5px;padding:1px 6px}
  .avail-yes{background:var(--gl2);color:var(--g)}
  .avail-no{background:var(--rb);color:var(--r)}

  /* Column sort & filters */
  .th-content{display:inline-flex;align-items:center;gap:6px}
  .th-sort{cursor:pointer;transition:color .15s}
  .th-sort:hover{color:var(--g)}
  .th-filter-btn{
    background:#eaf1eb;border:1px solid #c9d8cb;color:var(--mu);border-radius:4px;
    padding:2px 6px;font-size:10px;cursor:pointer;line-height:1.2;font-family:inherit;
    display:inline-flex;align-items:center;gap:3px;vertical-align:middle;transition:all .15s;
  }
  .th-filter-btn:hover{background:#dfebe0;color:var(--g);border-color:var(--g)}
  .th-filter-btn.active{background:var(--gl2);color:var(--g);border-color:var(--g2);font-weight:700}
  .filter-badge{background:var(--g);color:#fff;border-radius:999px;font-size:9px;padding:0 4px;font-weight:700}

  /* POPOVER FILTRO */
  .col-filter-popover{
    display:none;
    position:fixed;z-index:30;background:#fff;border:1px solid var(--bd);border-radius:12px;
    box-shadow:0 12px 36px rgba(0,0,0,.18);width:260px;max-width:92vw;
    flex-direction:column;padding:10px 12px;font-size:12px;color:var(--tx);
  }
  .col-filter-popover.on{display:flex}
  .popover-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:7px;border-bottom:1px solid var(--bd);font-weight:700}
  .popover-close-btn{background:none;border:0;font-size:16px;line-height:1;cursor:pointer;color:var(--mu);padding:2px 4px;border-radius:4px}
  .popover-close-btn:hover{color:var(--r);background:var(--rb)}
  .popover-quick{display:flex;align-items:center;gap:6px;padding:7px 0;font-size:11px}
  .popover-link-btn{background:none;border:none;color:var(--g);font-weight:600;cursor:pointer;font-size:11px;padding:2px 4px;border-radius:4px;font-family:inherit}
  .popover-link-btn:hover{background:var(--gl);text-decoration:underline}
  .popover-sep{color:var(--bd);font-size:10px}
  .popover-search-wrap{margin-bottom:8px}
  .popover-search-wrap input{width:100%;padding:6px 9px;border:1px solid var(--bd);border-radius:6px;font-size:11px;font-family:inherit;outline:none}
  .popover-search-wrap input:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(40,167,69,.15)}
  .popover-list{max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
  .filter-item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;user-select:none;font-size:11px}
  .filter-item:hover{background:var(--bg)}
  .filter-item input[type="checkbox"]{cursor:pointer;accent-color:var(--g);width:14px;height:14px}
  .filter-item-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filter-item-count{color:var(--mu);font-size:10px;font-weight:500}

  /* BUTTONS */
  .btn{border:0;border-radius:8px;padding:6px 11px;cursor:pointer;font:11px/1 'Inter',sans-serif;font-weight:600;transition:filter .15s,transform .1s}
  .btn:hover{filter:brightness(.92);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:var(--g2);color:#fff}
  .btn-sec{background:#fff;color:var(--tx);border:1px solid var(--bd)}
  .btn-sm{padding:4px 8px;font-size:11px;border-radius:6px}
  
  /* Botones Ver y + agrandados */
  .btn-table-ver{padding:6px 13px;font-size:12px;font-weight:600;border-radius:6px}
  .btn-table-add{padding:5px 13px;font-size:16px;font-weight:700;line-height:1;border-radius:6px}
  #more{display:block;margin:10px auto}

  /* BUDGET */
  .budget-unit-cell{white-space:nowrap;text-align:center}
  .bud-cu{font-size:10px;color:var(--mu);margin-top:2px}
  .budget-subtotal{font-weight:700;color:var(--g);font-size:12px;text-align:right;white-space:nowrap}
  .budget-total-bar{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--g);background:var(--gl)}
  .budget-total-bar .label{font-weight:600;font-size:13px}
  .budget-total-bar .amount{font-weight:700;font-size:18px;color:var(--g)}
  
  /* Boton Imprimir ancho y destacado */
  .budget-actions{padding:12px 14px;border-top:1px solid var(--bd);background:#fff}
  .btn-print{
    width:100%;padding:11px 16px;font-size:14px;font-weight:700;text-align:center;
    background:linear-gradient(135deg,#1b6e2e,#28a745);color:#fff;border:none;border-radius:9px;
    box-shadow:0 2px 8px rgba(27,110,46,.25);display:flex;align-items:center;justify-content:center;
    gap:8px;cursor:pointer;transition:all .15s;font-family:inherit;
  }
  .btn-print:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(27,110,46,.35);transform:translateY(-1px)}
  .btn-print:active{transform:translateY(0)}

  /* Input de cantidad limpio sin flechitas */
  .qty-input{
    width:52px;padding:5px 6px;border:1px solid var(--bd);border-radius:6px;text-align:center;
    font:13px 'Inter',sans-serif;font-weight:700;background:#fafcfa;color:var(--tx);
    -moz-appearance:textfield;appearance:textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }

  .x-btn{background:none;border:0;color:var(--r);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px}
  .x-btn:hover{background:var(--rb)}
  .empty{padding:28px 16px;text-align:center;color:var(--mu);font-size:12px}

  /* MODAL */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;backdrop-filter:blur(3px)}
  #modal.on{display:flex}
  .modal-box{
    background:#fff;border-radius:18px;max-width:880px;width:100%;max-height:92vh;
    overflow-y:auto;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.25);
  }
  /* Bloque superior 50/50: imagenes a la izq, datos a la der */
  .modal-top{
    display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--bd);
  }
  @media(max-width:720px){
    .modal-top{grid-template-columns:1fr}
    .modal-gallery{border-right:none!important;border-bottom:1px solid var(--bd)}
  }
  .modal-gallery{padding:18px;border-right:1px solid var(--bd);display:flex;flex-direction:column}
  .big-img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;border:1px solid var(--bd);background:#fff}
  .thumbs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .thumbs img{width:50px;height:50px;object-fit:contain;border:2px solid var(--bd);border-radius:7px;cursor:pointer;background:#fff;transition:border-color .15s}
  .thumbs img.on,.thumbs img:hover{border-color:var(--g)}
  .modal-info{padding:18px;display:flex;flex-direction:column;gap:9px}
  .modal-brand{font-size:11px;color:var(--mu);font-weight:500}
  .modal-name{font-size:17px;font-weight:700;line-height:1.3}
  .modal-price-block{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .modal-price{font-size:26px;font-weight:800;color:var(--g)}
  .modal-unit-label{font-size:14px;font-weight:700;color:#1a56db;background:#e8f0fe;padding:3px 8px;border-radius:6px;border:1px solid #c3d5fd}
  .modal-list-price{font-size:13px;color:var(--light);text-decoration:line-through}
  .modal-disc-pct{font-size:13px;font-weight:700;color:var(--o)}
  .modal-top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px}

  /* Bloque inferior al 100% de ancho desde Identificacion hacia abajo */
  .modal-bottom{padding:20px;display:flex;flex-direction:column;gap:12px;background:#fafcfa}
  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--light);letter-spacing:.5px;margin-top:4px}
  .specs-table{width:100%;border-collapse:collapse;margin-top:3px;background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
  .specs-table td{padding:6px 10px;font-size:12px;border-bottom:1px solid #f0f4f1;vertical-align:top}
  .specs-table tr:last-child td{border-bottom:none}
  .specs-table td:first-child{color:var(--mu);width:35%;font-weight:500;background:#fafcfa}
  .modal-desc{font-size:13px;color:#2c3e2e;line-height:1.6;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 14px;white-space:pre-line}
  a{color:var(--g);text-decoration:none}
  a:hover{text-decoration:underline}

  @media print{
    header,#more,.budget-actions,#clear,#modal,.col-filter-popover{display:none!important}
    main{display:block;padding:0}
    .panel{box-shadow:none;border:none}
  }
</style>
</head>
<body>

<header>
  <a href="/" class="header-link" style="padding:6px 10px;">← Ferreterías</a>
  <div class="logo">🧱 Sinsa <span>Presupuestos</span></div>
  <input id="q" type="search" placeholder="Buscar por nombre o marca… (ej: cable tsj ecoplus, tubo 1/2 durman)" autofocus>
  <a href="/ferreterias/sinsa/sinsa-descuentos.html" target="_blank" class="header-link">🏷️ Ver promociones</a>
</header>

<main>

  <!-- RESULTADOS -->
  <section class="panel">
    <div class="panel-head">
      <h2>Resultados <span class="meta" id="count"></span></h2>
      <button id="toggle-disc"><span class="dot"></span>🏷️ Solo con descuento</button>
    </div>
    <div id="results"><div class="empty">Empieza a escribir para buscar productos.</div></div>
    <button id="more" class="btn btn-sec" hidden>Cargar más resultados</button>
  </section>

  <!-- PRESUPUESTO -->
  <aside class="panel" id="budget-panel">
    <div class="panel-head">
      <h2>🧾 Presupuesto <span class="meta" id="nitems">0 ítems</span></h2>
      <button class="btn btn-sec btn-sm" id="clear" title="Vaciar presupuesto">🗑 Vaciar</button>
    </div>
    <div id="budget"><div class="empty">Añade productos con "+".</div></div>
    <div class="budget-total-bar">
      <span class="label">Total</span>
      <span class="amount" id="total">C$0.00</span>
    </div>
    <div class="budget-actions">
      <button class="btn btn-print" id="print">🖨 Imprimir Presupuesto</button>
    </div>
  </aside>

</main>

<div id="modal"><div class="modal-box" id="mbox"></div></div>

<!-- Popover flotante para filtro de columnas (Marca y Unidad) -->
<div id="col-filter-popover" class="col-filter-popover">
  <div class="popover-head">
    <span id="popover-title">Filtrar</span>
    <button type="button" id="popover-close" class="popover-close-btn" title="Cerrar">&times;</button>
  </div>
  <div class="popover-quick">
    <button type="button" id="popover-all" class="popover-link-btn">Todas</button>
    <span class="popover-sep">|</span>
    <button type="button" id="popover-none" class="popover-link-btn">Ninguna</button>
    <span class="popover-sep">|</span>
    <button type="button" id="popover-reset" class="popover-link-btn">Restablecer</button>
  </div>
  <div class="popover-search-wrap">
    <input type="text" id="popover-search" placeholder="Buscar opción…" autocomplete="off">
  </div>
  <div class="popover-list" id="popover-list"></div>
</div>

<script>
const API  = '/api/sinsa/io/_v/api/intelligent-search/product_search/';
const PAGE = 24;
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const money = n => 'C$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc   = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const thumb = u => u ? u.replace(/(\/ids\/\d+)\/[^?]*/,'$1-120-120/img.jpg') : '';
const pct   = (p,l) => l>p ? Math.round((1-p/l)*100) : 0;
const unitLabel = u => {
  if(!u) return 'Unidad';
  const m={m:'Metro',m2:'m²',m3:'m³',cm:'cm',kg:'kg',g:'gr',l:'Litro',ml:'ml',un:'Unidad',ud:'Unidad',pz:'Pieza',ft:'Pie','in':'Pulgada',gl:'Galón'};
  return m[u.toLowerCase()] || u;
};

let products=[], totalRecords=0, page=1, query='', sortKey=null, sortDir=1, ctrl=null, timer=null;
let showDiscOnly = false;
let selectedBrands = null; // null = sin filtro (todas); Set = marcas seleccionadas
let selectedUnits  = null; // null = sin filtro (todas); Set = unidades seleccionadas
let activeFilterCol = null;
let activeFilterBtn = null;

let budget = JSON.parse(localStorage.getItem('sinsa-budget')||'[]');
const pool = new Map(); // lookup global para modal

function norm(p){
  const item=p.items?.[0]||{};
  const off=item.sellers?.[0]?.commertialOffer||{};
  const spec={};
  (p.properties||[]).forEach(x=>{ if(x.name!=='sellerId' && x.name!=='Unidad de medida') spec[x.name]=(x.values||[]).join(', '); });
  const cats=(p.categories||[]).map(c=>c.split('/').filter(Boolean).pop()).filter(Boolean);
  const collections=Object.values(p.productClusters||{}).filter(Boolean);
  const raw={
    id:p.productId, name:p.productName, brand:p.brand||'',
    ref:p.productReference||'',
    ean:item.ean||item.referenceId?.find(r=>r.Key==='RefId')?.Value||'',
    price:off.Price??0, list:off.ListPrice??0,
    available:(off.AvailableQuantity??0)>0,
    cat:cats.join(' > '), cats, collections,
    link:'https://www.sinsa.com.ni'+(p.link||''),
    images:(item.images||[]).map(i=>i.imageUrl),
    desc:p.description||'', spec,
    unit:item.measurementUnit||'ud',
    teasers:off.Teasers||[],
  };
  pool.set(raw.id, raw);
  return raw;
}

async function search(reset=true){
  if(reset){
    page=1;products=[];
    selectedBrands=null;selectedUnits=null;
    closeFilterPopover();
  }
  if(query.length<2){render();return;}
  ctrl?.abort(); ctrl=new AbortController();
  $('#count').textContent='Buscando…';
  try{
    const url=`${API}?query=${encodeURIComponent(query)}&count=${PAGE}&page=${page}`;
    const r=await fetch(url,{signal:ctrl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    products=products.concat((j.products||[]).map(norm));
    totalRecords=j.recordsFiltered??products.length;
    render();
  }catch(e){
    if(e.name==='AbortError') return;
    $('#results').innerHTML=`<div class="empty">Error: ${esc(e.message)}. Verifica que server.js está corriendo.</div>`;
    $('#count').textContent='';
  }
}

function render(){
  let list=products.slice();
  if(selectedBrands!==null) list=list.filter(p=>selectedBrands.has(p.brand||'Sin marca'));
  if(selectedUnits!==null)  list=list.filter(p=>selectedUnits.has(unitLabel(p.unit)));
  if(showDiscOnly) list=list.filter(p=>p.list>p.price);
  if(sortKey){
    list.sort((a,b)=>{
      let va = sortKey==='unit' ? unitLabel(a.unit) : (a[sortKey]??'');
      let vb = sortKey==='unit' ? unitLabel(b.unit) : (b[sortKey]??'');
      if(typeof va==='string') va=va.toLowerCase();
      if(typeof vb==='string') vb=vb.toLowerCase();
      return (va>vb?1:-1)*sortDir;
    });
  }

  const filtersActive=[];
  if(showDiscOnly) filtersActive.push('con descuento');
  if(selectedBrands!==null) filtersActive.push(`marcas (${selectedBrands.size})`);
  if(selectedUnits!==null)  filtersActive.push(`unidades (${selectedUnits.size})`);

  const label = filtersActive.length ? ` (${filtersActive.join(', ')})` : '';
  $('#count').textContent=query.length<2?'':
    `${list.length}${label} de ${totalRecords}`;

  const empty=query.length<2?'Empieza a escribir para buscar productos.'
    :(filtersActive.length?'Ningún resultado coincide con los filtros aplicados.':'Sin resultados.');
  if(!list.length){
    $('#results').innerHTML=`<div class="empty">${empty}</div>`;
    $('#more').hidden=true; return;
  }
  const arrow=k=>sortKey===k?(sortDir>0?' ▲':' ▼'):'';
  const brandActive = selectedBrands !== null;
  const unitActive  = selectedUnits !== null;

  $('#results').innerHTML=
    `<table><thead><tr>
      <th></th>
      <th><span class="th-sort" data-k="name">Producto${arrow('name')}</span></th>
      <th>
        <div class="th-content">
          <span class="th-sort" data-k="brand">Marca${arrow('brand')}</span>
          <button type="button" class="th-filter-btn ${brandActive?'active':''}" data-filter-col="brand" title="Filtrar por marca">
            <span>Filtrar</span> <span>▾</span>
            ${brandActive ? `<span class="filter-badge">${selectedBrands.size}</span>` : ''}
          </button>
        </div>
      </th>
      <th>
        <div class="th-content">
          <span class="th-sort" data-k="unit">Unidad${arrow('unit')}</span>
          <button type="button" class="th-filter-btn ${unitActive?'active':''}" data-filter-col="unit" title="Filtrar por unidad">
            <span>Filtrar</span> <span>▾</span>
            ${unitActive ? `<span class="filter-badge">${selectedUnits.size}</span>` : ''}
          </button>
        </div>
      </th>
      <th style="text-align:right"><span class="th-sort" data-k="price">Precio${arrow('price')}</span></th>
      <th></th>
    </tr></thead><tbody>`+
    list.map(productRow).join('')+'</tbody></table>';
  $('#more').hidden=products.length>=totalRecords;
}

function productRow(p){
  const d=pct(p.price,p.list);
  const ul=unitLabel(p.unit);
  return `<tr>
    <td class="img-cell"><img loading="lazy" src="${esc(thumb(p.images[0]))}" data-open="${p.id}" alt=""></td>
    <td>
      <div class="name">${esc(p.name)}</div>
      <div class="sub">Ref ${esc(p.ref)} · ${esc(p.cat)}${p.collections.length?' · '+esc(p.collections[0]):''}</div>
    </td>
    <td style="font-size:12px">${esc(p.brand||'Sin marca')}</td>
    <td><span class="unit-badge">${esc(ul)}</span></td>
    <td class="price-col">
      ${money(p.price)}${d>0?`<span class="badge-disc">-${d}%</span>`:''}
      ${p.list>p.price?`<div class="list-price">${money(p.list)}</div>`:''}
      <div>${!p.available?'<span class="badge-avail avail-no">Agotado</span>':'<span class="badge-avail avail-yes">Disponible</span>'}</div>
    </td>
    <td style="white-space:nowrap">
      <button class="btn btn-sec btn-table-ver" data-open="${p.id}">Ver</button>
      <button class="btn btn-primary btn-table-add" data-add="${p.id}" title="Añadir al presupuesto">+</button>
    </td>
  </tr>`;
}

/* POPOVER FILTROS DE ENCABEZADO */
function getColItems(col){
  const counts=new Map();
  products.forEach(p=>{
    const val = col==='brand' ? (p.brand||'Sin marca') : unitLabel(p.unit);
    counts.set(val, (counts.get(val)||0) + 1);
  });
  return [...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0],'es'));
}

function openFilterPopover(col, btn){
  const pop=$('#col-filter-popover');
  if(activeFilterCol===col && pop.classList.contains('on')){
    closeFilterPopover();
    return;
  }
  activeFilterCol=col;
  activeFilterBtn=btn;
  $('#popover-title').textContent = col==='brand' ? 'Filtrar por Marca' : 'Filtrar por Unidad';
  $('#popover-search').value = '';
  renderFilterItems();

  pop.classList.add('on');
  positionPopover();
}

function positionPopover(){
  const pop=$('#col-filter-popover');
  if(!activeFilterBtn || !pop.classList.contains('on')) return;
  const rect=activeFilterBtn.getBoundingClientRect();
  pop.style.top=(rect.bottom + 5)+'px';
  let left=rect.left;
  if(left+270 > window.innerWidth){
    left = window.innerWidth - 280;
  }
  pop.style.left=Math.max(10, left)+'px';
}

function closeFilterPopover(){
  const pop=$('#col-filter-popover');
  pop.classList.remove('on');
  activeFilterCol=null;
  activeFilterBtn=null;
}

function renderFilterItems(){
  const col=activeFilterCol;
  if(!col) return;
  const items=getColItems(col);
  const filterSet = col==='brand' ? selectedBrands : selectedUnits;
  const qFilter = $('#popover-search').value.toLowerCase().trim();

  const filtered = items.filter(([name]) => !qFilter || name.toLowerCase().includes(qFilter));

  if(!filtered.length){
    $('#popover-list').innerHTML='<div style="padding:10px;text-align:center;color:var(--mu);font-size:11px">Sin opciones</div>';
    return;
  }

  $('#popover-list').innerHTML=filtered.map(([name, count])=>{
    const isChecked = filterSet===null ? true : filterSet.has(name);
    return `<label class="filter-item">
      <input type="checkbox" value="${esc(name)}" ${isChecked?'checked':''} data-filter-item="${col}">
      <span class="filter-item-name" title="${esc(name)}">${esc(name)}</span>
      <span class="filter-item-count">(${count})</span>
    </label>`;
  }).join('');
}

$('#popover-close').onclick = closeFilterPopover;
$('#popover-all').onclick = () => {
  if(activeFilterCol==='brand') selectedBrands=null;
  else if(activeFilterCol==='unit') selectedUnits=null;
  renderFilterItems();
  render();
};
$('#popover-none').onclick = () => {
  if(activeFilterCol==='brand') selectedBrands=new Set();
  else if(activeFilterCol==='unit') selectedUnits=new Set();
  renderFilterItems();
  render();
};
$('#popover-reset').onclick = () => {
  if(activeFilterCol==='brand') selectedBrands=null;
  else if(activeFilterCol==='unit') selectedUnits=null;
  renderFilterItems();
  render();
};
$('#popover-search').addEventListener('input', renderFilterItems);

$('#popover-list').addEventListener('change', e=>{
  if(!e.target.dataset.filterItem) return;
  const col=e.target.dataset.filterItem;
  const allItems=getColItems(col).map(i=>i[0]);
  let filterSet = col==='brand' ? selectedBrands : selectedUnits;

  if(filterSet===null){
    filterSet = new Set(allItems);
  }

  const val=e.target.value;
  if(e.target.checked){
    filterSet.add(val);
  }else{
    filterSet.delete(val);
  }

  if(filterSet.size===allItems.length){
    filterSet=null;
  }

  if(col==='brand') selectedBrands=filterSet;
  else selectedUnits=filterSet;

  render();
});

window.addEventListener('resize', positionPopover);
window.addEventListener('scroll', positionPopover, true);

/* MODAL */
function openModal(id){
  const p=pool.get(id)||budget.find(x=>x.id===id); if(!p) return;
  const imgs=p.images?.length?p.images:[];
  const d=pct(p.price,p.list), saving=p.list>p.price?p.list-p.price:0;
  const ul=unitLabel(p.unit);
  const specRows=Object.entries(p.spec||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  const eanRow=p.ean?`<tr><td>EAN</td><td><code>${esc(p.ean)}</code></td></tr>`:'';
  const colRow=p.collections?.length?`<tr><td>Colección</td><td>${p.collections.map(c=>`<strong>${esc(c)}</strong>`).join(', ')}</td></tr>`:'';

  $('#mbox').innerHTML=`
    <div class="modal-top">
      <div class="modal-gallery">
        <img class="big-img" id="big" src="${esc(imgs[0]||'')}" alt="">
        <div class="thumbs">${imgs.map((u,i)=>`<img src="${esc(thumb(u))}" data-img="${esc(u)}" class="${i===0?'on':''}" alt="">`).join('')}</div>
      </div>
      <div class="modal-info">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="modal-brand">${esc(p.brand)}</div>
          <button class="btn btn-sec btn-sm" id="close">✕ Cerrar</button>
        </div>
        <div class="modal-name">${esc(p.name)}</div>
        <div class="modal-price-block">
          <div class="modal-price">${money(p.price)}</div>
          <div class="modal-unit-label">por ${esc(ul)}</div>
          ${d>0?`<span class="badge-disc">-${d}%</span>`:''}
        </div>
        ${p.list>p.price?`<div>
          <div class="modal-list-price">Lista: ${money(p.list)}</div>
          <div class="modal-disc-pct">Ahorras ${money(saving)} por ${esc(ul)}</div>
        </div>`:''}
        <div>
          <span class="badge-avail ${p.available?'avail-yes':'avail-no'}">${p.available?'✔ Disponible':'✖ Agotado'}</span>
          ${p.cat?`<span class="sub" style="margin-left:6px">${esc(p.cat)}</span>`:''}
        </div>
        ${p.collections?.length?`<div class="sub">📂 ${p.collections.map(c=>esc(c)).join(', ')}</div>`:''}
        <div class="modal-top-actions">
          <button class="btn btn-primary" data-add="${p.id}">+ Añadir al presupuesto</button>
          <a href="${esc(p.link)}" target="_blank" rel="noopener" class="btn btn-sec">Abrir en Sinsa ↗</a>
        </div>
      </div>
    </div>
    <div class="modal-bottom">
      <div class="section-label">Identificación</div>
      <table class="specs-table">
        ${p.ref?`<tr><td>Referencia</td><td>${esc(p.ref)}</td></tr>`:''}
        ${eanRow}
        <tr><td>Unidad de medida</td><td><span class="unit-badge" style="font-size:12px;padding:3px 8px">${esc(ul)}</span></td></tr>
        ${colRow}
      </table>
      ${Object.keys(p.spec||{}).length?`<div class="section-label">Especificaciones</div><table class="specs-table">${specRows}</table>`:''}
      ${p.desc?`<div class="section-label">Descripción</div><div class="modal-desc">${p.desc}</div>`:''}
    </div>`;
  $('#modal').classList.add('on');
}

/* PRESUPUESTO */
function save(){localStorage.setItem('sinsa-budget',JSON.stringify(budget));renderBudget();}
function add(id){
  const ex=budget.find(b=>b.id===id);
  if(ex){ex.qty++;}else{const p=pool.get(id);if(p)budget.push({...p,qty:1});}
  save();
  const panel=$('#budget-panel');
  panel.style.boxShadow='0 0 0 3px #28a745';
  setTimeout(()=>panel.style.boxShadow='',700);
}
function renderBudget(){
  const grand=budget.reduce((s,b)=>s+b.price*b.qty,0);
  const discSave=budget.reduce((s,b)=>b.list>b.price?s+(b.list-b.price)*b.qty:s,0);
  $('#nitems').textContent=budget.length+(budget.length===1?' ítem':' ítems');
  $('#total').textContent=money(grand);
  if(!budget.length){$('#budget').innerHTML='<div class="empty">Añade productos con "+".</div>';return;}
  $('#budget').innerHTML=`
    <table>
      <thead><tr>
        <th></th><th>Producto</th>
        <th style="text-align:center">Unidad<br>c/u</th>
        <th style="text-align:center">Cant.</th>
        <th style="text-align:right">Subtotal</th>
        <th></th>
      </tr></thead>
      <tbody>${budget.map(b=>{
        const d=pct(b.price,b.list), ul=unitLabel(b.unit);
        return `<tr>
          <td class="img-cell"><img src="${esc(thumb(b.images?.[0]))}" data-open="${b.id}" alt=""></td>
          <td>
            <div class="name" style="font-size:11px">${esc(b.name)}</div>
            <div class="sub">${esc(b.brand)}${d>0?` <span class="badge-disc">-${d}%</span>`:''}</div>
          </td>
          <td class="budget-unit-cell">
            <span class="unit-badge">${esc(ul)}</span>
            <div class="bud-cu">${money(b.price)}</div>
          </td>
          <td style="text-align:center">
            <input class="qty-input" type="number" min="1" value="${b.qty}" data-qty="${b.id}">
          </td>
          <td class="budget-subtotal">${money(b.price*b.qty)}</td>
          <td><button class="x-btn" data-del="${b.id}" title="Quitar">✕</button></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    ${discSave>0?`<div style="padding:7px 14px;font-size:11px;color:var(--od);font-weight:600;background:var(--ob);border-top:1px solid #f5cba7">🏷️ Ahorras ${money(discSave)} en descuentos</div>`:''}`;
}

/* TOGGLE SOLO DESCUENTO */
$('#toggle-disc').addEventListener('click',()=>{
  showDiscOnly=!showDiscOnly;
  $('#toggle-disc').classList.toggle('on',showDiscOnly);
  render();
});

/* EVENTOS */
$('#q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{query=e.target.value.trim();search(true);},280);});
$('#more').addEventListener('click',()=>{page++;search(false);});

document.addEventListener('click',e=>{
  const t=e.target;

  // Botón cerrar popover
  if(t.id==='popover-close' || t.closest('#popover-close')){
    closeFilterPopover();
    return;
  }

  // Filtro de columnas
  const filterBtn = t.closest('[data-filter-col]');
  if(filterBtn){
    openFilterPopover(filterBtn.dataset.filterCol, filterBtn);
    return;
  }
  if(!t.closest('#col-filter-popover') && !t.closest('[data-filter-col]')){
    closeFilterPopover();
  }

  if(t.dataset.open){openModal(t.dataset.open);return;}
  if(t.dataset.add){add(t.dataset.add);return;}
  if(t.dataset.del){budget=budget.filter(b=>b.id!==t.dataset.del);save();return;}
  if(t.dataset.k){sortDir=sortKey===t.dataset.k?-sortDir:1;sortKey=t.dataset.k;render();return;}
  if(t.dataset.img){$('#big').src=t.dataset.img;$$('.thumbs img').forEach(i=>i.classList.toggle('on',i===t));return;}
  if(t.id==='close'||t.id==='modal')$('#modal').classList.remove('on');
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    $('#modal').classList.remove('on');
    closeFilterPopover();
  }
});

document.addEventListener('change',e=>{
  if(e.target.dataset.qty){
    const b=budget.find(x=>x.id===e.target.dataset.qty);
    if(b){b.qty=Math.max(1,+e.target.value||1);save();}
  }
});

/* BOTONES PRESUPUESTO */
$('#clear').onclick=()=>{if(confirm('¿Vaciar presupuesto?')){budget=[];save();}};
$('#print').onclick=()=>window.print();

renderBudget();
</script>
</body>
</html>
