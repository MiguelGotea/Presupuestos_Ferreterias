<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos Fetesa</title>
<meta name="description" content="Cotizador de presupuestos y materiales en tiempo real con catálogo oficial de Fetesa.">
<link rel="icon" type="image/svg+xml" href="/favicon-fetesa.svg">
<link rel="shortcut icon" href="/favicon-fetesa.svg">

<!-- Open Graph / WhatsApp / Redes Sociales -->
<meta property="og:type" content="website">
<meta property="og:title" content="Presupuestos Fetesa · Cotizador en Vivo">
<meta property="og:description" content="Busca materiales de construcción, calcula precios y arma presupuestos del catálogo oficial de Fetesa.">
<meta property="og:site_name" content="Presupuestos Ferreterías">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Presupuestos Fetesa · Cotizador en Vivo">
<meta name="twitter:description" content="Busca materiales de construcción, calcula precios y arma presupuestos del catálogo oficial de Fetesa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="/" class="header-link" style="padding:6px 10px;">← Ferreterías</a>
  <div class="logo">🔧 Fetesa <span>Presupuestos</span></div>
  <input id="q" type="search" placeholder="Buscar producto… (ej: pintura, taladro, tubo, cemento)" autofocus>
</header>

<main>

  <!-- RESULTADOS -->
  <section class="panel">
    <div class="panel-head">
      <h2>Resultados <span class="meta" id="count"></span></h2>
      <button id="toggle-disc"><span class="dot"></span>🏷️ Solo con descuento</button>
    </div>
    <div id="results"><div class="empty">Empieza a escribir para buscar productos.</div></div>
    <button id="more" class="btn btn-sec" hidden>Cargar más resultados</button>
  </section>

  <!-- PRESUPUESTO -->
  <aside class="panel" id="budget-panel">
    <div class="panel-head">
      <h2>🧾 Presupuesto <span class="meta" id="nitems">0 ítems</span></h2>
      <button class="btn btn-sec btn-sm" id="clear" title="Vaciar presupuesto">🗑 Vaciar</button>
    </div>
    <div id="budget"><div class="empty">Añade productos con "+".</div></div>
    <div class="budget-total-bar">
      <span class="label">Total</span>
      <span class="amount" id="total">C$0.00</span>
    </div>
    <div class="budget-actions">
      <button class="btn btn-print" id="print">🖨 Imprimir Presupuesto</button>
    </div>
  </aside>

</main>

<div id="modal"><div class="modal-box" id="mbox"></div></div>

<script src="app.js"></script>
</body>
</html>
