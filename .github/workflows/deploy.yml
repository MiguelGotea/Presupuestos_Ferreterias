name: 🚀 Deploy Presupuestos Ferreterias

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔑 Ejecutar deploy en VPS vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "📥 Actualizando código desde GitHub..."
          cd /root/presupuestos-ferreterias
          git pull origin main

          echo "🔄 Reiniciando servicio PM2..."
          fuser -k 3001/tcp 2>/dev/null || true
          sleep 1
          pm2 delete presupuestos-ferreterias 2>/dev/null || true
          pm2 start ecosystem.config.js

          echo "💾 Guardando estado PM2..."
          pm2 save

          echo "✅ Despliegue completado exitosamente."
